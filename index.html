<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para ti ❤️</title>
  <link rel="stylesheet" href="estilo.css" />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 1. VENTANA DEL VIDEO -->
  <section id="intro-screen" class="screen active">
    <div class="video-window">
      <video id="intro-video" autoplay muted playsinline>
        <source src="activos/videos/intro.mp4" type="video/mp4" />
      </video>
      <div class="video-footer">Un momento especial para ti...</div>
    </div>
  </section>

  <!-- 2. BOTÓN PARA CONTINUAR -->
  <section id="retro-screen" class="screen">
    <button class="continue-btn" id="continue-btn">Pulsa aquí para continuar</button>
  </section>

  <!-- 3. VENTANA DE LA DEDICATORIA -->
  <section id="dedication-screen" class="screen">
    <div class="dedication-window">
      <div id="dedication-text" class="dedication-text"></div>
    </div>
    <button id="surprise-btn" class="surprise-btn">Pulsa aquí para tu sorpresa</button>
  </section>

  <!-- 4. FOTO FINAL -->
  <section id="surprise-screen" class="screen">
    <img id="surprise-image" src="activos/images/sorpresa.png" alt="Para ti" />
  </section>

  <div id="youtube-container"></div>

  <script src="main.js"></script>
</body>
</html>
